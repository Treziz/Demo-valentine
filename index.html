<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เซอร์ไพรส์วาเลนไทน์ 💖</title>
    <style>
        body {
            text-align: center;
            background: url('https://source.unsplash.com/1600x900/?valentine,hearts') no-repeat center center/cover;
            font-family: 'Arial', sans-serif;
            color: white;
        }
        .container {
            margin-top: 50px;
            background: rgba(255, 182, 193, 0.8);
            padding: 20px;
            border-radius: 15px;
            display: inline-block;
        }
        h1 {
            color: #ff4d4d;
        }
        .heart {
            font-size: 50px;
            animation: float 1.5s infinite alternate;
        }
        @keyframes float {
            0% { transform: translateY(0); }
            100% { transform: translateY(-10px); }
        }
        .hidden-message {
            display: none;
            font-size: 20px;
            color: #d63384;
            margin-top: 20px;
        }
        .btn {
            background-color: #ff4d4d;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .image-container {
            margin-top: 20px;
        }
        .image-container img {
            width: 200px;
            height: auto;
            border-radius: 10px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>สุขสันต์วันวาเลนไทน์! 💕</h1>
        <p class="heart">❤️</p>
        <div class="image-container">
            <img src="your-image-url-here" alt="รูปภาพความรัก">
        </div>
        <button class="btn" onclick="showMessage()">กดเพื่อดูข้อความลับ</button>
        <p class="hidden-message" id="message">รักคุณที่สุดเลย! 💖</p>
    </div>
    <script>
        function showMessage() {
            document.getElementById("message").style.display = "block";
        }
    </script>
</body>
</html>
