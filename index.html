<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เซอร์ไพรส์วาเลนไทน์ 💖</title>
    <style>
        body {
            text-align: center;
            background: url('https://source.unsplash.com/1600x900/?valentine,hearts') no-repeat center center/cover;
            font-family: 'Arial', sans-serif;
            color: white;
        }
        .container {
            margin-top: 50px;
            background: rgba(255, 182, 193, 0.8);
            padding: 20px;
            border-radius: 15px;
            display: inline-block;
        }
        h1 {
            color: #ff4d4d;
        }
        .heart {
            font-size: 50px;
            animation: float 1.5s infinite alternate;
        }
        @keyframes float {
            0% { transform: translateY(0); }
            100% { transform: translateY(-10px); }
        }
        .hidden-message {
            display: none;
            font-size: 20px;
            color: #d63384;
            margin-top: 20px;
        }
        .btn {
            background-color: #ff4d4d;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .image-container {
            margin-top: 20px;
        }
        .image-container img {
            width: 200px;
            height: auto;
            border-radius: 10px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.3);
        }
        .choices {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .choice {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .choice-btn {
            background-color: #ff66b2;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        .choice img {
            width: 150px;
            height: auto;
            border-radius: 10px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Happy Valentine Day Kub 💕</h1>
        <p class="heart">❤️</p>
        <div class="image-container">
            <img src="./assets/Beam1.jpg" alt="รูปภาพความรัก">
        </div>
        <button class="btn" onclick="showMessage()">กดเพื่อดูข้อความลับ</button>
        <p class="hidden-message" id="message">รักคุณที่สุดเลย! 💖</p>
        <div class="choices">
            <div class="choice">
                <img src="your-choice1-image-url" alt="ตัวเลือก 1">
                <button class="choice-btn" onclick="showAnswer(1)">ตัวเลือก 1</button>
            </div>
            <div class="choice">
                <img src="your-choice2-image-url" alt="ตัวเลือก 2">
                <button class="choice-btn" onclick="showAnswer(2)">ตัวเลือก 2</button>
            </div>
        </div>
        <p class="hidden-message" id="answer"></p>
    </div>

    <script>
        function showMessage() {
            document.getElementById("message").style.display = "block";
        }

        function showAnswer(choice) {
            // ปิดการใช้งานปุ่มตัวเลือกทั้งสองปุ่ม
            document.querySelectorAll('.choice-btn').forEach(function(button) {
                button.disabled = true;
            });

            let answers = [
                { text: "เฉลยที่ 1: คุณคือความรักของฉัน 💖", img: "your-choice1-image-url" },
                { text: "เฉลยที่ 2: อยู่กับคุณคือสิ่งที่ดีที่สุด! 💕", img: "your-choice2-image-url" }
            ];
            let selectedAnswer = answers[choice - 1];  // เลือกคำตอบตามตัวเลือกที่กด
            document.getElementById("answer").textContent = selectedAnswer.text;

            // แสดงรูปภาพในข้อความที่ซ่อน
            let imgElement = document.createElement("img");
            imgElement.src = selectedAnswer.img;
            imgElement.alt = "รูปภาพตัวเลือก";
            imgElement.style.width = "150px";
            imgElement.style.height = "auto";
            imgElement.style.borderRadius = "10px";
            imgElement.style.boxShadow = "0px 4px 6px rgba(0, 0, 0, 0.3)";

            // เพิ่มรูปภาพในข้อความที่ซ่อน
            document.getElementById("answer").appendChild(imgElement);

            document.getElementById("answer").style.display = "block";
        }
    </script>
</body>
</html>
