<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เซอร์ไพรส์วาเลนไทน์ 💖</title>
    <style>
        body {
            text-align: center;
            background: url('https://source.unsplash.com/1600x900/?valentine,hearts') no-repeat center center/cover;
            font-family: 'Arial', sans-serif;
            color: white;
            overflow-x: hidden;
        }
        .container {
            margin-top: 50px;
            background: rgba(255, 182, 193, 0.8);
            padding: 20px;
            border-radius: 15px;
            display: inline-block;
            max-width: 90%;
        }
        h1 {
            color: #ff4d4d;
        }
        .heart {
            font-size: 50px;
            animation: float 1.5s infinite alternate;
        }
        @keyframes float {
            0% { transform: translateY(0); }
            100% { transform: translateY(-10px); }
        }
        .hidden-message {
            display: none;
            font-size: 20px;
            color: #d63384;
            margin-top: 20px;
        }
        .btn {
            background-color: #ff4d4d;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .image-container {
            margin-top: 20px;
        }
        .image-container img {
            width: 100%;
            max-width: 200px;
            height: auto;
            border-radius: 10px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.3);
        }
        .choices {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .choice {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .choice-btn {
            background-color: #ff66b2;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        .choice img {
            width: 100%;
            max-width: 150px;
            height: auto;
            border-radius: 10px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.3);
        }
        .result-container {
            display: none;
            margin-top: 20px;
            text-align: center;
        }
        .result-container img {
            width: 100%;
            max-width: 200px;
            height: auto;
            border-radius: 10px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.3);
            margin-top: 10px;
        }
        @media (min-width: 768px) {
            .choices {
                flex-direction: row;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Happy Valentine Day Kub 💕</h1>
        <p class="heart">❤️</p>
        <div class="image-container">
            <img src="./assets/img/Beam1.JPG" alt="รูปภาพความรัก">
        </div>
        <button class="btn" onclick="showMessage()"> กดตรงนี้ๆๆก่อน </button>
        <p class="hidden-message" id="message">เค้ารักเธอที่สุดเลยคั้บไอมุ ขอบคุณที่อยู่ข้างๆเค้า<br>ดูแลเค้าอย่างดีมาโดยตลอด ดีใจที่มีเธอมากๆ<br>ไว้เราไปกินอะไรอร่อยๆด้วยกันนะ<br>สุขสันต์วันวาเลนไทน์ค้าบบบ 💖</p>
        <p class="choice-title">สุ่มจิ้มคั้บ เลือกได้ครั้งเดียวห้ามโกงๆ 💖</p>

        <div class="choices">
            <div class="choice">
                <img src="./assets/img/Beam2.JPG" alt="ตัวเลือก 1">
                <button class="choice-btn" onclick="showAnswer(1)">เลือกอันนี้</button>
            </div>
            <div class="choice">
                <img src="./assets/img/Beam3.JPG" alt="ตัวเลือก 2">
                <button class="choice-btn" onclick="showAnswer(2)">อันนี้ดีกว่า</button>
            </div>
        </div>
    
        <div class="result-container" id="result">
            <p id="answer"></p>
            <img id="result-img" src="" alt="">
        </div>
    </div>

    <script>
        function showMessage() {
            document.getElementById("message").style.display = "block";
        }

        function showAnswer(choice) {
            document.querySelectorAll('.choice-btn').forEach(button => button.disabled = true);

            let answers = [
                { text: "ไอมุได้เลือกสถานที่เที่ยวที่อยากไปคั้บบ 💕", img: "./assets/img/Beam4.jpeg" },
                { text: "ไอมุได้เลือกร้านบุฟเฟ่ต์หรือรูฟท็อปที่อยากไปป 💕", img: "./assets/img/Beam5.jpeg" }
            ];
            let selectedAnswer = answers[choice - 1];
            
            document.getElementById("answer").textContent = selectedAnswer.text;
            document.getElementById("result-img").src = selectedAnswer.img;
            document.getElementById("result-img").alt = "รูปภาพตัวเลือก";
            
            document.getElementById("result").style.display = "block";
        }
    </script>
</body>
</html>
